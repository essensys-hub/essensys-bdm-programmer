# Contrôle du schéma KiCad de la carte de diagnostic BP
# (feature carte-diagnostic-bp-2026-11-009, essensys-hub/essensys-feature-lifecycle#67).
name: hardware

on:
  pull_request:
    paths: ["hardware/**", "tests/test_carte_diagnostic_netlist.py", ".github/workflows/hardware.yml"]
  push:
    branches: [master]
    paths: ["hardware/**"]

permissions:
  contents: read

jobs:
  kicad:
    runs-on: ubuntu-24.04
    container:
      image: kicad/kicad:10.0
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Schéma à jour par rapport au générateur
        run: |
          export KICAD9_SYMBOL_DIR=/usr/share/kicad/symbols
          python3 hardware/carte-diagnostic-bp/gen_sch.py
          git config --global --add safe.directory "$PWD"
          git diff --exit-code -- hardware/carte-diagnostic-bp
      - name: ERC et invariants de la netlist
        run: |
          cd hardware/carte-diagnostic-bp
          kicad-cli sch erc --severity-all --exit-code-violations -o /tmp/erc.rpt carte-diagnostic-bp.kicad_sch
          kicad-cli sch export netlist --format kicadsexpr -o /tmp/carte.net carte-diagnostic-bp.kicad_sch
          python3 check_netlist.py /tmp/carte.net
